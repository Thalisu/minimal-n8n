services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:?N8N_VERSION is required}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      # Heap budget: 512 (main) + 256 (task runner child process) leaves ~256 MB for
      # native memory under mem_limit; exceeding it OOM-kills the whole container.
      NODE_OPTIONS: --max-old-space-size=512
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: 256
      # n8n 2.x only lets Read/Write Files nodes touch ~/.n8n-files by default.
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  n8n_data:
